# Builds the Java (Javadoc), C# (DocFX), Go (doc2go) and Swift (DocC) API
# references and publishes them to GitHub Pages:
# https://edragoev1.github.io/pdfjet/java/, .../net/, .../go/ and .../swift/
# The site also serves examples-java.html, examples-dotnet.html, the example
# sources they link to and the PDF files the Java examples create.
#
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.

name: Documentation

on:
    push:
        branches: [ master ]
        paths:
            - "com/**"
            - "net/**"
            - "PDFjet.csproj"
            - "docfx/**"
            - "src/**"
            - "go.mod"
            - "Sources/**"
            - "Package.swift"
            - "examples/**"
            - "fonts/**"
            - "images/**"
            - "data/**"
            - "PngSuite/**"
            - "examples-java.html"
            - "examples-dotnet.html"
            - "generate-documentation.sh"
            - "build-java.sh"
            - ".github/workflows/docs.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        # Pinned to the Ubuntu release the Swift toolchain below is built for.
        runs-on: ubuntu-24.04
        steps:
            # Only the ports, the DocFX configuration, the examples and the fonts,
            # images and data the examples read are checked out. Files in the
            # repository root are always checked out.
            - uses: actions/checkout@v7
              with:
                  sparse-checkout: |
                      com
                      net
                      docfx
                      src
                      Sources
                      examples
                      fonts
                      images
                      data
                      PngSuite

            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "21"

            - uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "8.0.x"

            - name: Install DocFX
              run: |
                  dotnet tool install -g docfx --version 2.78.5
                  echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: false

            # DocC comes with the Swift toolchain. The Swift in the runner image
            # is not relied on: the swift.org toolchain is installed and its
            # signature checked, as in the official Swift Docker image.
            - name: Install the Swift toolchain
              env:
                  SWIFT_URL: https://download.swift.org/swift-6.3.3-release/ubuntu2404/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz
                  SWIFT_SIGNING_KEY: 52BB7E3DE28A71BE22EC05FFEF80A866B47A981F
              run: |
                  sudo apt-get -q update
                  sudo apt-get -q install -y binutils git unzip gnupg2 libc6-dev \
                      libcurl4-openssl-dev libedit2 libgcc-13-dev libpython3-dev \
                      libsqlite3-0 libstdc++-13-dev libxml2-dev libncurses-dev \
                      libz3-dev pkg-config tzdata zlib1g-dev
                  cd "$RUNNER_TEMP"
                  curl -fsSL "$SWIFT_URL" -o swift.tar.gz "$SWIFT_URL.sig" -o swift.tar.gz.sig
                  export GNUPGHOME="$(mktemp -d)"
                  gpg --batch --quiet --keyserver keyserver.ubuntu.com --recv-keys "$SWIFT_SIGNING_KEY"
                  gpg --batch --verify swift.tar.gz.sig swift.tar.gz
                  mkdir swift
                  tar -xzf swift.tar.gz --directory swift --strip-components=1
                  rm -rf "$GNUPGHOME" swift.tar.gz swift.tar.gz.sig
                  swift/usr/bin/swift --version
                  test -x swift/usr/bin/docc
                  echo "$RUNNER_TEMP/swift/usr/bin" >> "$GITHUB_PATH"

            - name: Generate the documentation
              run: bash generate-documentation.sh

            # The example pages link to the PDF files the Java examples create.
            # bash -e stops at the first example that fails, and the check after
            # it makes sure every example created its PDF file.
            - name: Build the example PDFs
              run: |
                  bash -e build-java.sh
                  test "$(ls Example_*.pdf | wc -l)" -eq 50

            - name: Assemble the site
              run: |
                  site="$RUNNER_TEMP/site"
                  mkdir -p "$site"
                  cp -r docs/java "$site/java"
                  cp -r docs/_net "$site/net"
                  cp -r docs/go "$site/go"
                  cp -r docs/swift "$site/swift"
                  # The example pages link to the sources in examples/ and to the
                  # PDF files the Java examples created.
                  cp examples-java.html examples-dotnet.html "$site/"
                  cp -r examples "$site/examples"
                  cp Example_*.pdf "$site/"
                  cat > "$site/index.html" <<'EOF'
                  <!doctype html>
                  <html lang="en">
                  <head>
                  <meta charset="utf-8">
                  <title>PDFjet</title>
                  </head>
                  <body>
                  <h1>PDFjet</h1>
                  <p>PDF library for Java, C#, Swift and Go developers.
                  The source code is on <a href="https://github.com/edragoev1/pdfjet">GitHub</a>.</p>
                  <h2>API reference</h2>
                  <ul>
                  <li><a href="java/">Java</a> (<code>com.pdfjet</code>)</li>
                  <li><a href="net/">C#</a> (<code>PDFjet.NET</code>)</li>
                  <li><a href="go/">Go</a> (<code>github.com/edragoev1/pdfjet/src</code>)</li>
                  <li><a href="swift/">Swift</a> (<code>PDFjet</code>)</li>
                  </ul>
                  <h2>Examples</h2>
                  <ul>
                  <li><a href="examples-java.html">Java examples</a></li>
                  <li><a href="examples-dotnet.html">C# examples</a></li>
                  </ul>
                  <p><a href="https://github.com/edragoev1/pdfjet/blob/master/CHANGELOG.md">Changelog</a>
                  · <a href="https://github.com/edragoev1/pdfjet/blob/master/SECURITY.md">Security policy</a></p>
                  </body>
                  </html>
                  EOF

            - uses: actions/upload-pages-artifact@v5
              with:
                  path: ${{ runner.temp }}/site

    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
