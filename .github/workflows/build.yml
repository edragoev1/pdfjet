# Builds the Java, C#, Go and Swift ports and runs their examples, one job per
# port, with the port's build-*.sh script, and then the port's unit tests with
# its test-*.sh script. A job fails if the library or an example does not
# compile or compiles with a warning, go vet reports a problem in the Go port,
# an example exits with an error, an example does not create its PDF file, or a
# unit test fails. The compare job
# then checks the PDFs: each example must render the same, with the same text
# and drawing instructions, in every port as in Java, and the examples that
# declare PDF/A or PDF/UA compliance must pass veraPDF, and the text MuPDF and
# pdftotext extract must be the text the examples drew. The java8 job builds the
# Java port with JDK 8 and runs its examples on Java 8. The corpus job reads,
# merges and splits the pdf.js and veraPDF test corpora with each port and
# checks what it gets against MuPDF. The references job checks the images the
# Go port embeds against Pillow and the fonts it reads against fontTools.

name: Build

on:
    push:
        branches: [ master ]
        paths-ignore:
            - "**.md"
            - "docfx/**"
            - "examples-java.html"
            - "examples-dotnet.html"
            - ".github/workflows/docs.yml"
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

# A newer push to the same branch cancels a build that is still running.
concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: ${{ matrix.port }}
        # Pinned to the Ubuntu release the Swift toolchain is built for.
        runs-on: ubuntu-24.04
        strategy:
            # A failing port does not cancel the others.
            fail-fast: false
            matrix:
                port: [ java, dotnet, go, swift ]
        steps:
            - uses: actions/checkout@v7

            - if: matrix.port == 'java'
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "21"

            - if: matrix.port == 'dotnet'
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "8.0.x"

            - if: matrix.port == 'go'
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: false

            - if: matrix.port == 'swift'
              uses: ./.github/actions/install-swift

            # bash -e stops at the first example that fails. The Java and C#
            # scripts compile the examples in parallel, so an example that does
            # not compile fails the job when the script runs it.
            - name: Build and run the examples
              run: bash -e build-${{ matrix.port }}.sh

            - name: Check that every example created its PDF file
              run: |
                  missing=0
                  for i in $(seq -w 1 51); do
                      if [ ! -s "Example_$i.pdf" ]; then
                          echo "::error::Example_$i.pdf was not created"
                          missing=1
                      fi
                  done
                  exit $missing

            # The compare job checks these PDFs.
            - name: Upload the example PDFs
              uses: actions/upload-artifact@v7
              with:
                  name: example-pdfs-${{ matrix.port }}
                  path: Example_*.pdf
                  if-no-files-found: error
                  retention-days: 3

            # The strings every Go example draws, which the compare job checks
            # the text of every port's PDFs against. The examples are built again
            # with the texttrace tag, which records them.
            - if: matrix.port == 'go'
              name: Record the text the examples draw
              run: .github/scripts/trace-go-examples.sh "$RUNNER_TEMP/text"

            - if: matrix.port == 'go'
              uses: actions/upload-artifact@v7
              with:
                  name: text-trace
                  path: ${{ runner.temp }}/text/text-trace.jsonl
                  if-no-files-found: error
                  retention-days: 3

            # The unit tests in tests/<port>, or next to the code in src for Go.
            # The Java script downloads the JUnit console launcher and checks
            # its SHA-256; the C# tests restore xUnit from NuGet.
            - name: Run the unit tests
              run: bash -e test-${{ matrix.port }}.sh

    # The java job builds with JDK 21 and javac --release 8. This job builds with
    # JDK 8, whose javac has no --release option, and runs the examples and the
    # unit tests on the Java 8 runtime, so the library, the examples, the tests,
    # build-java.sh and test-java.sh keep working there. The compare job does not
    # check its PDFs.
    java8:
        name: java (JDK 8)
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "8"

            - name: Build and run the examples
              run: bash -e build-java.sh

            - name: Check that every example created its PDF file
              run: |
                  missing=0
                  for i in $(seq -w 1 51); do
                      if [ ! -s "Example_$i.pdf" ]; then
                          echo "::error::Example_$i.pdf was not created"
                          missing=1
                      fi
                  done
                  exit $missing

            - name: Run the unit tests
              run: bash -e test-java.sh

    # Checks the PDFs of all four ports with .github/scripts/check-example-pdfs.py,
    # and what the tags of the tagged ones stand for with check-pdfua-tags.py.
    compare:
        needs: build
        runs-on: ubuntu-24.04
        steps:
            # The script reads the Java examples for their compliance level and
            # the password of the encrypted example.
            - uses: actions/checkout@v7
              with:
                  sparse-checkout: |
                      .github
                      examples

            # Each port's PDFs go into their own folder, example-pdfs-<port>.
            - uses: actions/download-artifact@v8
              with:
                  pattern: example-pdfs-*
                  path: ${{ runner.temp }}/pdfs

            - uses: actions/download-artifact@v8
              with:
                  name: text-trace
                  path: ${{ runner.temp }}/text

            # veraPDF runs on Java.
            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "21"

            # PyMuPDF renders the pages and extracts their text. It comes with
            # its own MuPDF and fonts, so the pinned version gives the same
            # result on every machine.
            - name: Install PyMuPDF
              run: |
                  python3 -m venv "$RUNNER_TEMP/venv"
                  "$RUNNER_TEMP/venv/bin/pip" install -q pymupdf==1.28.2

            # The installer's SHA-256 is pinned. Its signature was checked against
            # the veraPDF release key published at https://docs.verapdf.org/install/
            # (fingerprint 13DD 102B 4DD6 9354 D12D E5A8 3184 8632 78B1 7FE7).
            # Only the command line application is installed.
            - name: Install veraPDF
              env:
                  VERAPDF_URL: https://software.verapdf.org/releases/1.30/verapdf-greenfield-1.30.2-installer.zip
                  VERAPDF_SHA256: 6cc6341cb1af644044054b81f00a6590a7918abb18f762243de115258bcad838
              run: |
                  cd "$RUNNER_TEMP"
                  curl -fsSL --retry 3 --retry-all-errors -o verapdf.zip "$VERAPDF_URL"
                  echo "$VERAPDF_SHA256  verapdf.zip" | sha256sum -c -
                  unzip -q verapdf.zip
                  cat > auto-install.xml <<EOF
                  <?xml version="1.0" encoding="UTF-8" standalone="no"?>
                  <AutomatedInstallation langpack="eng">
                      <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
                      <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
                          <installpath>$RUNNER_TEMP/verapdf</installpath>
                      </com.izforge.izpack.panels.target.TargetPanel>
                      <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
                          <pack index="0" name="veraPDF GUI" selected="false"/>
                          <pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/>
                          <pack index="2" name="veraPDF Validation model" selected="false"/>
                          <pack index="3" name="veraPDF Documentation" selected="false"/>
                          <pack index="4" name="veraPDF Sample Plugins" selected="false"/>
                      </com.izforge.izpack.panels.packs.PacksPanel>
                      <com.izforge.izpack.panels.install.InstallPanel id="install"/>
                      <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
                  </AutomatedInstallation>
                  EOF
                  java -jar verapdf-greenfield-1.30.2/verapdf-izpack-installer-1.30.2.jar auto-install.xml
                  "$RUNNER_TEMP/verapdf/verapdf" --version

            - name: Check the example PDFs
              env:
                  VERAPDF: ${{ runner.temp }}/verapdf/verapdf
              run: |
                  "$RUNNER_TEMP/venv/bin/python" .github/scripts/check-example-pdfs.py \
                      "$RUNNER_TEMP/pdfs/example-pdfs-{port}"

            # pdftotext, of Poppler, extracts the text beside MuPDF.
            - name: Check the text of the example PDFs
              run: |
                  sudo apt-get install -y -q poppler-utils
                  "$RUNNER_TEMP/venv/bin/python" .github/scripts/check-example-text.py \
                      "$RUNNER_TEMP/text/text-trace.jsonl" "$RUNNER_TEMP/pdfs/example-pdfs-{port}"

            # What the tags of the tagged documents stand for, which veraPDF
            # cannot check. The Java PDFs stand for all four ports: the step
            # above has just checked that the content streams of the other
            # three are the same.
            - name: Check what the PDF/UA tags stand for
              run: |
                  "$RUNNER_TEMP/venv/bin/python" .github/scripts/check-pdfua-tags.py \
                      "$RUNNER_TEMP/pdfs/example-pdfs-java"

    # Checks the reader against real PDFs with tests/corpus/check-corpus.py.
    # The corpora are fetched, not committed, and cached by the commits that
    # fetch-corpora.sh pins.
    corpus:
        name: corpus (${{ matrix.port }})
        runs-on: ubuntu-24.04
        strategy:
            # A port that fails does not cancel the others.
            fail-fast: false
            matrix:
                port: [ java, dotnet, go, swift ]
        steps:
            - uses: actions/checkout@v7

            - if: matrix.port == 'java'
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "21"

            - if: matrix.port == 'dotnet'
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "8.0.x"

            - if: matrix.port == 'go'
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: false

            - if: matrix.port == 'swift'
              uses: ./.github/actions/install-swift

            - name: Install PyMuPDF
              run: |
                  python3 -m venv "$RUNNER_TEMP/venv"
                  "$RUNNER_TEMP/venv/bin/pip" install -q pymupdf==1.28.2

            - uses: actions/cache@v6
              with:
                  path: .corpora
                  key: corpora-${{ hashFiles('tests/corpus/fetch-corpora.sh', 'tests/corpus/fetch-links.py') }}

            # The PDFs pdf.js links to come from many sites, the Web Archive's
            # slowly; a link that is dead is left out, not failed.
            - name: Fetch the corpora
              run: |
                  tests/corpus/fetch-corpora.sh .corpora
                  python3 tests/corpus/fetch-links.py .corpora

            - name: Check the reader against the corpora
              run: |
                  "$RUNNER_TEMP/venv/bin/python" tests/corpus/check-corpus.py .corpora --port ${{ matrix.port }}

    # Checks the images PDFjet embeds against Pillow and the fonts it reads
    # against fontTools, with tests/references. The images and the fonts are
    # fetched, not committed, and cached by what their fetch scripts pin.
    references:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: false

            - name: Install PyMuPDF, Pillow and fontTools
              run: |
                  python3 -m venv "$RUNNER_TEMP/venv"
                  "$RUNNER_TEMP/venv/bin/pip" install -q pymupdf==1.28.2 Pillow==12.3.0 fonttools==4.65.0

            - uses: actions/cache@v6
              with:
                  path: |
                      .images
                      .reference-fonts
                  key: references-${{ hashFiles('tests/references/images/fetch-images.sh', 'tests/references/fonts/fetch-fonts.sh') }}

            - name: Fetch the images and the fonts
              run: |
                  tests/references/images/fetch-images.sh .images
                  tests/references/fonts/fetch-fonts.sh .reference-fonts

            - name: Check the images against Pillow
              run: |
                  "$RUNNER_TEMP/venv/bin/python" tests/references/images/check-images.py .images

            - name: Check the fonts against fontTools
              run: |
                  "$RUNNER_TEMP/venv/bin/python" tests/references/fonts/check-fonts.py .reference-fonts
